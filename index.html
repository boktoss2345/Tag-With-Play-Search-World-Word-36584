<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* GAME - KEEP FULL SCREEN */
        #game {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: 0;
            display: block;
            z-index: 1;
        }

        /* ADS OVERLAY */
        #adOverlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.82);
            z-index: 999999;
        }

        #adContainer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .ad-media {
            display: block;
            object-fit: contain;
            max-height: 72vh;
        }

        .ad-button {
            border: none;
            cursor: pointer;
            font-weight: bold;
            white-space: pre-line;
            padding: 12px 18px;
        }

        #countdown {
            position: absolute;
            top: 18px;
            right: 18px;

            width: 52px;
            height: 52px;

            border-radius: 50%;

            background: rgba(0,0,0,0.8);
            border: 3px solid white;

            color: white;
            font-size: 18px;
            font-weight: bold;

            display: none;
            align-items: center;
            justify-content: center;

            z-index: 1000000;
        }
    </style>
</head>

<body>

<!-- GAME -->
<iframe
    id="game"
    src="https://www.madkidgames.com/full/subway-surfers"
    allow="fullscreen; autoplay"
    allowfullscreen
    scrolling="no">
</iframe>


<!-- AD OVERLAY -->
<div id="adOverlay">
    <div id="adContainer">
        <div id="countdown"></div>
    </div>
</div>


<script>

let adsConfig = null;
let currentAdIndex = 0;

let closeTimer = null;
let countdownTimer = null;
let repeatTimer = null;


/* ==========================
   LOAD ADS.JSON ON APP START
   ========================== */

async function loadAdsConfig() {

    try {

        /* avoid cached old JSON */
        const response = await fetch(
            "ads.json?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error("ads.json HTTP " + response.status);
        }

        adsConfig = await response.json();

        console.log("ADS CONFIG LOADED:", adsConfig);

        if (
            !adsConfig ||
            adsConfig.enabled !== true ||
            !Array.isArray(adsConfig.ads)
        ) {
            return;
        }

        const delay =
            Number(adsConfig.initialDelaySeconds || 0) * 1000;

        setTimeout(() => {

            showNextAd();

        }, delay);

    }

    catch (error) {

        console.error(
            "Cannot load ads.json:",
            error
        );

    }
}


/* ==========================
   GET NEXT ENABLED AD
   ========================== */

function getNextAd() {

    if (
        !adsConfig ||
        !Array.isArray(adsConfig.ads)
    ) {
        return null;
    }

    const enabledAds =
        adsConfig.ads.filter(
            ad => ad && ad.enabled !== false
        );

    if (!enabledAds.length) {
        return null;
    }

    const mode =
        adsConfig.behavior?.selectionMode || "sequence";


    /* RANDOM */

    if (mode === "random") {

        return enabledAds[
            Math.floor(
                Math.random() * enabledAds.length
            )
        ];

    }


    /* SEQUENCE */

    const ad =
        enabledAds[
            currentAdIndex % enabledAds.length
        ];

    currentAdIndex++;

    return ad;
}


/* ==========================
   SHOW AD
   ========================== */

async function showNextAd() {

    if (!adsConfig?.enabled) {
        return;
    }


    /* Refresh JSON before every ad */

    if (
        adsConfig.behavior?.refreshConfigBeforeShow === true
    ) {

        try {

            const response = await fetch(
                "ads.json?t=" + Date.now(),
                {
                    cache: "no-store"
                }
            );

            if (response.ok) {

                const newConfig =
                    await response.json();

                if (newConfig) {
                    adsConfig = newConfig;
                }

            }

        } catch (e) {

            console.log(
                "Ads refresh failed:",
                e
            );

        }

    }


    const ad = getNextAd();

    if (!ad) {
        scheduleNextAd();
        return;
    }

    renderAd(ad);
}


/* ==========================
   RENDER AD
   ========================== */

function renderAd(ad) {

    const overlay =
        document.getElementById("adOverlay");

    const container =
        document.getElementById("adContainer");

    const countdown =
        document.getElementById("countdown");


    /* remove previous ad elements */

    container
        .querySelectorAll(".dynamic-ad")
        .forEach(el => el.remove());


    const elements =
        Array.isArray(ad.elements)
            ? ad.elements
            : [];


    let countdownSeconds =
        Number(
            adsConfig.showDurationSeconds || 20
        );


    elements.forEach(element => {

        if (
            !element ||
            element.enabled === false
        ) {
            return;
        }


        /* =====================
           VIDEO
           ===================== */

        if (element.type === "video") {

            const video =
                document.createElement("video");

            video.className =
                "dynamic-ad ad-media";

            video.src =
                element.src;

            video.autoplay =
                element.autoplay !== false;

            video.loop =
                element.loop !== false;

            video.muted =
                element.muted !== false;

            video.controls =
                element.controls === true;

            video.playsInline = true;


            applyElementSize(
                video,
                element
            );


            if (element.cornerRadiusDp) {

                video.style.borderRadius =
                    element.cornerRadiusDp + "px";

            }


            if (
                element.clickable &&
                element.url
            ) {

                video.style.cursor =
                    "pointer";

                video.onclick = () =>
                    openAdLink(element.url);

            }


            container.appendChild(video);


            video.play().catch(() => {});

        }


        /* =====================
           IMAGE
           ===================== */

        else if (element.type === "image") {

            const img =
                document.createElement("img");

            img.className =
                "dynamic-ad ad-media";

            img.src =
                element.src;


            applyElementSize(
                img,
                element
            );


            if (element.cornerRadiusDp) {

                img.style.borderRadius =
                    element.cornerRadiusDp + "px";

            }


            if (
                element.clickable &&
                element.url
            ) {

                img.style.cursor =
                    "pointer";

                img.onclick = () =>
                    openAdLink(element.url);

            }


            container.appendChild(img);

        }


        /* =====================
           BUTTON
           ===================== */

        else if (element.type === "button") {

            const button =
                document.createElement("button");

            button.className =
                "dynamic-ad ad-button";

            button.textContent =
                element.text || "DOWNLOAD";


            if (element.widthPercent) {

                button.style.width =
                    element.widthPercent + "%";

            }


            if (element.maxWidthDp) {

                button.style.maxWidth =
                    element.maxWidthDp + "px";

            }


            if (element.marginDp) {

                button.style.marginTop =
                    element.marginDp + "px";

            }


            button.style.background =
                element.backgroundColor ||
                "#FFD400";

            button.style.color =
                element.textColor ||
                "#000000";


            if (element.textSizeSp) {

                button.style.fontSize =
                    element.textSizeSp + "px";

            }


            if (element.cornerRadiusDp) {

                button.style.borderRadius =
                    element.cornerRadiusDp + "px";

            }


            if (
                element.clickable &&
                element.url
            ) {

                button.onclick = () =>
                    openAdLink(element.url);

            }


            container.appendChild(button);

        }


        /* =====================
           COUNTDOWN
           ===================== */

        else if (element.type === "countdown") {

            if (element.enabled !== false) {

                countdownSeconds =
                    Number(
                        element.seconds ||
                        countdownSeconds
                    );

            }

        }

    });


    /* overlay color from JSON */

    if (adsConfig.overlay?.scrimColor) {

        overlay.style.background =
            hex8ToRgba(
                adsConfig.overlay.scrimColor
            );

    }


    overlay.style.display = "flex";


    startCountdown(
        countdownSeconds
    );


    clearTimeout(closeTimer);

    closeTimer = setTimeout(() => {

        closeAd();

    }, countdownSeconds * 1000);

}


/* ==========================
   SIZE
   ========================== */

function applyElementSize(
    element,
    config
) {

    if (config.widthPercent) {

        element.style.width =
            config.widthPercent + "%";

    }


    if (config.maxWidthDp) {

        element.style.maxWidth =
            config.maxWidthDp + "px";

    }


    element.style.height = "auto";

}


/* ==========================
   COUNTDOWN
   ========================== */

function startCountdown(seconds) {

    clearInterval(countdownTimer);

    const countdown =
        document.getElementById("countdown");


    if (
        adsConfig.countdown?.enabled === false
    ) {

        countdown.style.display = "none";
        return;

    }


    let remaining = seconds;

    countdown.style.display = "flex";
    countdown.textContent = remaining;


    countdownTimer =
        setInterval(() => {

            remaining--;

            countdown.textContent =
                Math.max(remaining, 0);


            if (remaining <= 0) {

                clearInterval(
                    countdownTimer
                );

            }

        }, 1000);

}


/* ==========================
   CLOSE AD
   ========================== */

function closeAd() {

    clearTimeout(closeTimer);
    clearInterval(countdownTimer);


    const overlay =
        document.getElementById(
            "adOverlay"
        );

    const countdown =
        document.getElementById(
            "countdown"
        );


    overlay.style.display = "none";

    countdown.style.display = "none";


    document
        .querySelectorAll(
            "#adContainer video"
        )
        .forEach(video => {

            video.pause();

            video.removeAttribute("src");

            video.load();

        });


    scheduleNextAd();

}


/* ==========================
   NEXT AD
   ========================== */

function scheduleNextAd() {

    clearTimeout(repeatTimer);


    if (!adsConfig?.enabled) {
        return;
    }


    const seconds =
        Number(
            adsConfig.repeatEverySeconds || 10
        );


    repeatTimer =
        setTimeout(() => {

            showNextAd();

        }, seconds * 1000);

}


/* ==========================
   AMAZON DEEP LINK
   ========================== */

function openAdLink(url) {

    if (!url) return;


    try {

        window.location.href = url;

    }

    catch (error) {

        console.error(
            "Cannot open ad URL:",
            error
        );

    }

}


/* ==========================
   #AARRGGBB -> RGBA
   ========================== */

function hex8ToRgba(hex) {

    if (
        typeof hex !== "string" ||
        !/^#[0-9A-Fa-f]{8}$/.test(hex)
    ) {

        return hex;

    }


    const a =
        parseInt(
            hex.slice(1, 3),
            16
        ) / 255;

    const r =
        parseInt(
            hex.slice(3, 5),
            16
        );

    const g =
        parseInt(
            hex.slice(5, 7),
            16
        );

    const b =
        parseInt(
            hex.slice(7, 9),
            16
        );


    return `rgba(${r},${g},${b},${a})`;
}


/* ==========================
   START
   ========================== */

document.addEventListener(
    "DOMContentLoaded",
    loadAdsConfig
);

</script>

</body>
</html>
